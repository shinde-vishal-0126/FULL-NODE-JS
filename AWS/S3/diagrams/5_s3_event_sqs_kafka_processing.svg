<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="100%" height="100%" style="background:#0f172a; font-family: 'Inter', -apple-system, sans-serif;">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ff9900"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#8b5cf6"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981"/>
    </marker>
  </defs>

  <text x="550" y="42" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="800">Asynchronous Video Processing: S3 + SQS / Kafka + FFmpeg</text>
  <text x="550" y="68" text-anchor="middle" fill="#94a3b8" font-size="13">Event-Driven Microservices &#8226; S3 ObjectCreated Notifications &#8226; Transcoding Fleet &#8226; Zero Dropped Videos</text>

  <!-- Step 1: Raw S3 Upload -->
  <g transform="translate(40, 110)" filter="url(#shadow)">
    <rect width="210" height="360" rx="12" fill="#1e293b" stroke="#ff9900" stroke-width="2"/>
    <rect width="210" height="38" rx="12" fill="#d97706"/>
    <text x="105" y="24" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">1. S3 Raw Storage</text>

    <g transform="translate(15, 55)">
      <rect width="180" height="65" rx="6" fill="#0f172a" stroke="#ff9900"/>
      <text x="10" y="22" fill="#ff9900" font-size="11" font-weight="700">Raw Video Ingest</text>
      <text x="10" y="40" fill="#94a3b8" font-size="10">Key: videos/raw/901.mp4</text>
      <text x="10" y="56" fill="#4ade80" font-size="10">Direct upload from client</text>
    </g>

    <g transform="translate(15, 135)">
      <rect width="180" height="110" rx="6" fill="#0f172a" stroke="#ec4899"/>
      <text x="10" y="22" fill="#f472b6" font-size="11" font-weight="700">S3 Event Notification</text>
      <text x="10" y="42" fill="#94a3b8" font-size="9">&#8226; Event: <tspan fill="#f8fafc">ObjectCreated:Put</tspan></text>
      <text x="10" y="58" fill="#94a3b8" font-size="9">&#8226; Filter: <tspan fill="#f8fafc">prefix: videos/raw/</tspan></text>
      <text x="10" y="74" fill="#94a3b8" font-size="9">&#8226; Filter: <tspan fill="#f8fafc">suffix: .mp4</tspan></text>
      <text x="10" y="96" fill="#38bdf8" font-size="10" font-weight="600">Dispatches instantly!</text>
    </g>

    <g transform="translate(15, 260)">
      <rect width="180" height="85" rx="6" fill="#0f172a" stroke="#334155"/>
      <text x="10" y="24" fill="#38bdf8" font-size="11" font-weight="700">Reliability Feature</text>
      <text x="10" y="44" fill="#94a3b8" font-size="9">&#8226; AWS guarantees delivery</text>
      <text x="10" y="60" fill="#94a3b8" font-size="9">&#8226; If backend is down, S3</text>
      <text x="10" y="74" fill="#94a3b8" font-size="9">  retries notification</text>
    </g>
  </g>

  <!-- Connectors S3 to SQS/Kafka -->
  <path d="M 250 240 L 320 240" stroke="#ff9900" stroke-width="2.5" marker-end="url(#arrowOrange)"/>
  <text x="285" y="230" text-anchor="middle" fill="#ff9900" font-size="9" font-weight="700">PUSH</text>

  <!-- Step 2: SQS Queue or Kafka Topic -->
  <g transform="translate(320, 110)" filter="url(#shadow)">
    <rect width="230" height="360" rx="12" fill="#1e293b" stroke="#8b5cf6" stroke-width="2"/>
    <rect width="230" height="38" rx="12" fill="#7c3aed"/>
    <text x="115" y="24" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">2. Buffer: SQS / Kafka</text>

    <g transform="translate(15, 55)">
      <rect width="200" height="80" rx="6" fill="#0f172a" stroke="#8b5cf6"/>
      <text x="10" y="22" fill="#a78bfa" font-size="11" font-weight="700">Queue / Stream Buffer</text>
      <text x="10" y="42" fill="#94a3b8" font-size="10">&#8226; SQS: video-transcode-queue</text>
      <text x="10" y="58" fill="#94a3b8" font-size="10">&#8226; Kafka: video.raw.uploaded</text>
      <text x="10" y="72" fill="#4ade80" font-size="10">&#8226; Buffers 10,000+ uploads</text>
    </g>

    <g transform="translate(15, 150)">
      <rect width="200" height="95" rx="6" fill="#0f172a" stroke="#334155"/>
      <text x="10" y="22" fill="#38bdf8" font-size="11" font-weight="700">Message Payload JSON</text>
      <text x="10" y="40" fill="#fcd34d" font-size="9">{"bucket": "blackbuck-s3",</text>
      <text x="10" y="56" fill="#fcd34d" font-size="9"> "key": "videos/raw/901.mp4",</text>
      <text x="10" y="72" fill="#fcd34d" font-size="9"> "size": 524288000,</text>
      <text x="10" y="88" fill="#fcd34d" font-size="9"> "etag": "c3ab12..."}</text>
    </g>

    <g transform="translate(15, 260)">
      <rect width="200" height="85" rx="6" fill="#0f172a" stroke="#f59e0b"/>
      <text x="10" y="22" fill="#fcd34d" font-size="11" font-weight="700">Dead-Letter Queue (DLQ)</text>
      <text x="10" y="42" fill="#94a3b8" font-size="9">&#8226; maxReceiveCount: 3 retries</text>
      <text x="10" y="58" fill="#94a3b8" font-size="9">&#8226; Corrupt video file goes to</text>
      <text x="10" y="72" fill="#f87171" font-size="9">  DLQ without breaking queue</text>
    </g>
  </g>

  <!-- Connectors SQS to Worker -->
  <path d="M 550 240 L 610 240" stroke="#8b5cf6" stroke-width="2.5" marker-end="url(#arrowPurple)"/>
  <text x="580" y="230" text-anchor="middle" fill="#8b5cf6" font-size="9" font-weight="700">POLL</text>

  <!-- Step 3: FFmpeg Video Worker Fleet -->
  <g transform="translate(610, 110)" filter="url(#shadow)">
    <rect width="240" height="360" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <rect width="240" height="38" rx="12" fill="#059669"/>
    <text x="120" y="24" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">3. FFmpeg Worker (Node.js)</text>

    <g transform="translate(15, 55)">
      <rect width="210" height="80" rx="6" fill="#0f172a" stroke="#10b981"/>
      <text x="10" y="22" fill="#4ade80" font-size="11" font-weight="700">Download &amp; Transcode</text>
      <text x="10" y="42" fill="#94a3b8" font-size="10">&#8226; Streams S3 GetObject to /tmp</text>
      <text x="10" y="58" fill="#94a3b8" font-size="10">&#8226; Spawns FFmpeg ChildProcess</text>
      <text x="10" y="74" fill="#38bdf8" font-size="10">&#8226; Scales via KEDA on EKS</text>
    </g>

    <g transform="translate(15, 145)">
      <rect width="210" height="100" rx="6" fill="#0f172a" stroke="#334155"/>
      <text x="10" y="22" fill="#fcd34d" font-size="11" font-weight="700">Generated Outputs:</text>
      <text x="10" y="40" fill="#94a3b8" font-size="9">1. HLS Stream (720p, 1080p, .m3u8)</text>
      <text x="10" y="56" fill="#94a3b8" font-size="9">2. 3 JPG Thumbnails (at t=10s)</text>
      <text x="10" y="72" fill="#94a3b8" font-size="9">3. Video Duration &amp; Audio bitrates</text>
      <text x="10" y="90" fill="#4ade80" font-size="9">&#10004; Purges /tmp temporary disk</text>
    </g>

    <g transform="translate(15, 255)">
      <rect width="210" height="90" rx="6" fill="#0f172a" stroke="#38bdf8"/>
      <text x="10" y="22" fill="#38bdf8" font-size="11" font-weight="700">Upload Processed to S3</text>
      <text x="10" y="42" fill="#94a3b8" font-size="10">PutObjectCommand to:</text>
      <text x="10" y="58" fill="#f8fafc" font-size="9">videos/processed/901/master.m3u8</text>
      <text x="10" y="76" fill="#4ade80" font-size="10">&#10004; DeleteMessage from SQS</text>
    </g>
  </g>

  <!-- Connectors Worker to DB & CDN -->
  <path d="M 850 240 L 900 240" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrowGreen)"/>

  <!-- Step 4: Database & Delivery -->
  <g transform="translate(900, 110)" filter="url(#shadow)">
    <rect width="160" height="360" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <rect width="160" height="38" rx="12" fill="#0284c7"/>
    <text x="80" y="24" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">4. Database &amp; CDN</text>

    <!-- PostgreSQL Box -->
    <g transform="translate(10, 55)">
      <rect width="140" height="135" rx="6" fill="#0f172a" stroke="#334155"/>
      <text x="10" y="22" fill="#38bdf8" font-size="11" font-weight="700">PostgreSQL DB</text>
      <text x="10" y="40" fill="#94a3b8" font-size="9">UPDATE videos</text>
      <text x="10" y="54" fill="#a7f3d0" font-size="9">SET status =</text>
      <text x="10" y="68" fill="#4ade80" font-size="9" font-weight="700">'PROCESSED',</text>
      <text x="10" y="84" fill="#94a3b8" font-size="9">hls_url = '...',</text>
      <text x="10" y="100" fill="#94a3b8" font-size="9">thumb_url = '...'</text>
      <text x="10" y="120" fill="#94a3b8" font-size="9">WHERE id = 901;</text>
    </g>

    <!-- CloudFront CDN Box -->
    <g transform="translate(10, 205)">
      <rect width="140" height="140" rx="6" fill="#0f172a" stroke="#00f0ff"/>
      <text x="10" y="24" fill="#00f0ff" font-size="11" font-weight="700">CloudFront CDN</text>
      <text x="10" y="44" fill="#94a3b8" font-size="9">Streams HLS to</text>
      <text x="10" y="58" fill="#94a3b8" font-size="9">millions of users</text>
      <text x="10" y="72" fill="#94a3b8" font-size="9">worldwide with</text>
      <text x="10" y="86" fill="#94a3b8" font-size="9">zero buffer stalls!</text>
      <rect x="10" y="102" width="120" height="26" rx="4" fill="#065f46"/>
      <text x="70" y="119" text-anchor="middle" fill="#a7f3d0" font-size="10" font-weight="700">&#10004; Production Ready</text>
    </g>
  </g>
</svg>
