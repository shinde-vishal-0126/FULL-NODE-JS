<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="100%" height="100%" style="background:#0f172a; font-family: 'Inter', -apple-system, sans-serif;">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#00f0ff"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ff9900"/>
    </marker>
  </defs>

  <text x="550" y="42" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="800">S3 Multipart Upload Architecture (Files &gt; 100 MB to 5 TB)</text>
  <text x="550" y="68" text-anchor="middle" fill="#94a3b8" font-size="13">Initiate &#8226; Parallel Chunk Upload &#8226; Independent Part Retry &#8226; Assembly via CompleteMultipartUpload</text>

  <!-- Step 1: Initiate -->
  <g transform="translate(40, 110)" filter="url(#shadow)">
    <rect width="200" height="360" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <rect width="200" height="38" rx="12" fill="#0284c7"/>
    <text x="100" y="24" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">1. Initiate Upload</text>

    <g transform="translate(15, 60)">
      <rect width="170" height="70" rx="6" fill="#0f172a" stroke="#334155"/>
      <text x="10" y="24" fill="#38bdf8" font-size="11" font-weight="700">CreateMultipartUpload</text>
      <text x="10" y="44" fill="#94a3b8" font-size="10">&#8226; Key: "4k_video.mp4"</text>
      <text x="10" y="58" fill="#94a3b8" font-size="10">&#8226; Total Size: 5.0 GB</text>
    </g>

    <g transform="translate(15, 150)">
      <rect width="170" height="90" rx="6" fill="#0f172a" stroke="#f59e0b"/>
      <text x="10" y="22" fill="#fcd34d" font-size="11" font-weight="700">AWS Returns:</text>
      <text x="10" y="44" fill="#4ade80" font-size="11" font-weight="600">UploadId:</text>
      <text x="10" y="62" fill="#f8fafc" font-size="9" font-family="monospace">"VXBsb2FkSWQxMjM..."</text>
      <text x="10" y="80" fill="#94a3b8" font-size="10">Session valid for days</text>
    </g>

    <g transform="translate(15, 260)">
      <rect width="170" height="85" rx="6" fill="#0f172a" stroke="#334155"/>
      <text x="10" y="22" fill="#38bdf8" font-size="11" font-weight="700">Chunking Engine</text>
      <text x="10" y="42" fill="#94a3b8" font-size="10">&#8226; Part size: 100 MB</text>
      <text x="10" y="58" fill="#94a3b8" font-size="10">&#8226; Split into 50 parts</text>
      <text x="10" y="74" fill="#4ade80" font-size="10">&#8226; Ready for parallel I/O</text>
    </g>
  </g>

  <!-- Connectors -->
  <path d="M 240 290 L 300 290" stroke="#00f0ff" stroke-width="2.5" marker-end="url(#arrowCyan)"/>

  <!-- Step 2: Parallel Upload of Parts -->
  <g transform="translate(300, 110)" filter="url(#shadow)">
    <rect width="450" height="360" rx="12" fill="#1e293b" stroke="#ff9900" stroke-width="2"/>
    <rect width="450" height="38" rx="12" fill="#d97706"/>
    <text x="225" y="24" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">2. Parallel UploadPart Execution (Multi-Threaded)</text>

    <!-- Part 1 -->
    <g transform="translate(20, 55)">
      <rect width="410" height="55" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
      <text x="15" y="22" fill="#4ade80" font-size="11" font-weight="700">&#10004; Part 1 (100 MB) &#8226; Thread #1</text>
      <text x="15" y="42" fill="#94a3b8" font-size="10">UploadPartCommand(UploadId, PartNumber=1) &#8594; ETag: "1b2cf535..."</text>
    </g>

    <!-- Part 2 -->
    <g transform="translate(20, 120)">
      <rect width="410" height="55" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
      <text x="15" y="22" fill="#4ade80" font-size="11" font-weight="700">&#10004; Part 2 (100 MB) &#8226; Thread #2</text>
      <text x="15" y="42" fill="#94a3b8" font-size="10">UploadPartCommand(UploadId, PartNumber=2) &#8594; ETag: "9f83a211..."</text>
    </g>

    <!-- Part 3 (Network drop & Retry!) -->
    <g transform="translate(20, 185)">
      <rect width="410" height="75" rx="6" fill="#450a0a" stroke="#ef4444" stroke-width="1.5"/>
      <text x="15" y="22" fill="#f87171" font-size="11" font-weight="700">&#9888; Part 3 (100 MB) &#8226; Network Timeout Occurred!</text>
      <text x="15" y="40" fill="#fca5a5" font-size="10">&#8226; Resiliency Rule: ONLY Part 3 is retried with exponential backoff.</text>
      <text x="15" y="58" fill="#4ade80" font-size="10">&#10004; Retry Succeeded! Part 1 and Part 2 are NOT re-uploaded.</text>
    </g>

    <!-- Part N -->
    <g transform="translate(20, 270)">
      <rect width="410" height="50" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
      <text x="15" y="22" fill="#4ade80" font-size="11" font-weight="700">&#10004; Part 4 to Part 50 (Remaining 4.7 GB)</text>
      <text x="15" y="40" fill="#94a3b8" font-size="10">Client collects { PartNumber, ETag } array in memory.</text>
    </g>
  </g>

  <!-- Connectors -->
  <path d="M 750 290 L 800 290" stroke="#ff9900" stroke-width="2.5" marker-end="url(#arrowOrange)"/>

  <!-- Step 3: Complete Assembly -->
  <g transform="translate(800, 110)" filter="url(#shadow)">
    <rect width="260" height="360" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <rect width="260" height="38" rx="12" fill="#059669"/>
    <text x="130" y="24" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">3. Complete &amp; Assembly</text>

    <g transform="translate(15, 60)">
      <rect width="230" height="80" rx="6" fill="#0f172a" stroke="#10b981"/>
      <text x="10" y="22" fill="#4ade80" font-size="11" font-weight="700">CompleteMultipartUpload</text>
      <text x="10" y="42" fill="#94a3b8" font-size="10">&#8226; Sends ordered parts list:</text>
      <text x="10" y="60" fill="#cbd5e1" font-size="9">Parts: [{PartNumber:1, ETag}, ...]</text>
    </g>

    <g transform="translate(15, 155)">
      <rect width="230" height="90" rx="6" fill="#0f172a" stroke="#ff9900"/>
      <text x="10" y="22" fill="#ff9900" font-size="11" font-weight="700">Atomic S3 Stitching</text>
      <text x="10" y="42" fill="#94a3b8" font-size="10">&#8226; S3 merges 50 parts into</text>
      <text x="10" y="58" fill="#94a3b8" font-size="10">  one single 5.0 GB object</text>
      <text x="10" y="76" fill="#4ade80" font-size="10">&#8226; Object immediately visible</text>
    </g>

    <g transform="translate(15, 260)">
      <rect width="230" height="85" rx="6" fill="#0f172a" stroke="#ef4444"/>
      <text x="10" y="22" fill="#f87171" font-size="11" font-weight="700">&#9888; Cost Prevention Tip</text>
      <text x="10" y="42" fill="#94a3b8" font-size="9">Configure S3 Lifecycle:</text>
      <text x="10" y="56" fill="#fcd34d" font-size="9">AbortIncompleteMultipartUpload</text>
      <text x="10" y="72" fill="#94a3b8" font-size="9">Purges orphan chunks after 7 days!</text>
    </g>
  </g>
</svg>
