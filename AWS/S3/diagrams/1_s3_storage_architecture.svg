<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="100%" height="100%" style="background:#0f172a; font-family: 'Inter', -apple-system, sans-serif;">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="550" y="42" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="800">Amazon S3 Object Storage Architecture</text>
  <text x="550" y="68" text-anchor="middle" fill="#94a3b8" font-size="13">Flat Namespace &#8226; Buckets &#8226; Prefixes as Logical Keys &#8226; Object Payload &amp; Metadata</text>

  <!-- Bucket Container Outer Box -->
  <g transform="translate(40, 95)" filter="url(#shadow)">
    <rect width="1020" height="400" rx="14" fill="#1e293b" stroke="#ff9900" stroke-width="2.5"/>
    
    <!-- Bucket Header -->
    <path d="M 0 14 Q 0 0 14 0 L 1006 0 Q 1020 0 1020 14 L 1020 45 L 0 45 Z" fill="#d97706"/>
    <text x="25" y="28" fill="#ffffff" font-size="15" font-weight="800">🪣 AWS S3 Bucket: blackbuck-production</text>
    <text x="780" y="28" fill="#fef3c7" font-size="12" font-weight="600">Region: ap-south-1 (Mumbai) &#8226; Private</text>

    <!-- Column 1: Logical Folder Structure (Prefixes) -->
    <g transform="translate(25, 65)">
      <rect width="300" height="315" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
      <text x="20" y="30" fill="#38bdf8" font-size="13" font-weight="700">Logical Hierarchy (Object Keys)</text>
      <text x="20" y="50" fill="#94a3b8" font-size="10">S3 has NO physical directories. "/" is a prefix delimiter.</text>

      <!-- Key item 1 -->
      <g transform="translate(15, 65)">
        <rect width="270" height="42" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
        <text x="12" y="25" fill="#f8fafc" font-size="11" font-weight="600">📁 images/users/101/avatar.jpg</text>
      </g>

      <!-- Key item 2 (Active) -->
      <g transform="translate(15, 120)">
        <rect width="270" height="55" rx="6" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5"/>
        <text x="12" y="22" fill="#ffffff" font-size="11" font-weight="700">🎬 videos/contest/500/final.mp4</text>
        <text x="12" y="42" fill="#e0f2fe" font-size="10">&#8226; Key = Full unique string identifier</text>
      </g>

      <!-- Key item 3 -->
      <g transform="translate(15, 190)">
        <rect width="270" height="42" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="12" y="25" fill="#f8fafc" font-size="11" font-weight="600">📄 reports/2026/sales_q3.pdf</text>
      </g>

      <!-- Key item 4 -->
      <g transform="translate(15, 245)">
        <rect width="270" height="42" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="12" y="25" fill="#f8fafc" font-size="11" font-weight="600">🗄️ backups/postgres_daily.sql.gz</text>
      </g>
    </g>

    <!-- Arrow from Key to Object Details -->
    <path d="M 340 215 L 385 215" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)"/>

    <!-- Column 2: Anatomy of an S3 Object -->
    <g transform="translate(400, 65)">
      <rect width="595" height="315" rx="10" fill="#0f172a" stroke="#00f0ff" stroke-width="1.5"/>
      <text x="25" y="30" fill="#00f0ff" font-size="14" font-weight="700">Anatomy of an S3 Object: "videos/contest/500/final.mp4"</text>

      <!-- Subgrid 1: Payload / Data -->
      <g transform="translate(20, 50)">
        <rect width="260" height="115" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
        <text x="15" y="25" fill="#4ade80" font-size="12" font-weight="700">1. Data Payload (Binary Bytes)</text>
        <text x="15" y="50" fill="#94a3b8" font-size="11">&#8226; Size: 485.2 MB (Up to 5 TB)</text>
        <text x="15" y="72" fill="#94a3b8" font-size="11">&#8226; Storage Class: <tspan fill="#fcd34d" font-weight="600">S3 Standard</tspan></text>
        <text x="15" y="94" fill="#94a3b8" font-size="11">&#8226; Durability: <tspan fill="#4ade80" font-weight="700">99.999999999% (11 9s)</tspan></text>
      </g>

      <!-- Subgrid 2: System & User Metadata -->
      <g transform="translate(300, 50)">
        <rect width="275" height="115" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
        <text x="15" y="25" fill="#38bdf8" font-size="12" font-weight="700">2. Object Metadata</text>
        <text x="15" y="48" fill="#94a3b8" font-size="10">&#8226; Content-Type: <tspan fill="#f8fafc">video/mp4</tspan></text>
        <text x="15" y="68" fill="#94a3b8" font-size="10">&#8226; Cache-Control: <tspan fill="#f8fafc">public, max-age=31536000</tspan></text>
        <text x="15" y="88" fill="#94a3b8" font-size="10">&#8226; x-amz-meta-uploader: <tspan fill="#f8fafc">user_id_941</tspan></text>
        <text x="15" y="104" fill="#94a3b8" font-size="10">&#8226; ETag: <tspan fill="#cbd5e1">"c4ca4238a0b923820dcc509a6f"</tspan></text>
      </g>

      <!-- Subgrid 3: Versioning & Security -->
      <g transform="translate(20, 180)">
        <rect width="260" height="115" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5"/>
        <text x="15" y="25" fill="#a78bfa" font-size="12" font-weight="700">3. Versioning &amp; Identity</text>
        <text x="15" y="50" fill="#94a3b8" font-size="11">&#8226; VersionId: <tspan fill="#f8fafc">3/L4kqtJlToeXJog8JYw...</tspan></text>
        <text x="15" y="72" fill="#94a3b8" font-size="11">&#8226; Multi-Version Retention: <tspan fill="#4ade80">Enabled</tspan></text>
        <text x="15" y="94" fill="#94a3b8" font-size="11">&#8226; Protects against accidental deletion</text>
      </g>

      <!-- Subgrid 4: Tags & Encryption -->
      <g transform="translate(300, 180)">
        <rect width="275" height="115" rx="8" fill="#1e293b" stroke="#ec4899" stroke-width="1.5"/>
        <text x="15" y="25" fill="#f472b6" font-size="12" font-weight="700">4. Tags &amp; Encryption at Rest</text>
        <text x="15" y="50" fill="#94a3b8" font-size="11">&#8226; Encryption: <tspan fill="#4ade80">SSE-S3 / SSE-KMS (256-bit)</tspan></text>
        <text x="15" y="72" fill="#94a3b8" font-size="11">&#8226; Tag: <tspan fill="#fbcfe8">env=production</tspan></text>
        <text x="15" y="94" fill="#94a3b8" font-size="11">&#8226; Tag: <tspan fill="#fbcfe8">contest_id=500 &#8226; type=video</tspan></text>
      </g>
    </g>
  </g>
</svg>
