<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="100%" height="100%" style="background:#0f172a; font-family: 'Inter', -apple-system, sans-serif;">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <text x="550" y="42" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="800">Amazon S3 Security, IAM &amp; Encryption Defense-in-Depth</text>
  <text x="550" y="68" text-anchor="middle" fill="#94a3b8" font-size="13">Block Public Access &#8226; IAM Least Privilege &#8226; Resource Bucket Policies &#8226; KMS Server-Side Encryption</text>

  <!-- Pillar 1: Block Public Access -->
  <g transform="translate(40, 110)" filter="url(#shadow)">
    <rect width="235" height="370" rx="12" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
    <rect width="235" height="40" rx="12" fill="#b91c1c"/>
    <text x="117" y="25" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">1. Block Public Access</text>

    <g transform="translate(15, 60)">
      <rect width="205" height="90" rx="6" fill="#450a0a" stroke="#ef4444" stroke-width="1.5"/>
      <text x="10" y="24" fill="#fca5a5" font-size="11" font-weight="700">&#128274; 4 Essential Settings: ALL ON</text>
      <text x="10" y="44" fill="#fecaca" font-size="9">1. BlockPublicAcls: true</text>
      <text x="10" y="58" fill="#fecaca" font-size="9">2. IgnorePublicAcls: true</text>
      <text x="10" y="72" fill="#fecaca" font-size="9">3. BlockPublicPolicy: true</text>
      <text x="10" y="86" fill="#fecaca" font-size="9">4. RestrictPublicBuckets: true</text>
    </g>

    <g transform="translate(15, 165)">
      <rect width="205" height="95" rx="6" fill="#0f172a" stroke="#334155"/>
      <text x="10" y="22" fill="#f87171" font-size="11" font-weight="700">Master Kill-Switch</text>
      <text x="10" y="42" fill="#94a3b8" font-size="10">&#8226; Overrides any human mistake</text>
      <text x="10" y="58" fill="#94a3b8" font-size="10">&#8226; Prevents public data leaks</text>
      <text x="10" y="76" fill="#4ade80" font-size="10">&#10004; Applied at Account &amp; Bucket</text>
    </g>

    <g transform="translate(15, 275)">
      <rect width="205" height="85" rx="6" fill="#0f172a" stroke="#ef4444"/>
      <text x="10" y="22" fill="#fca5a5" font-size="10" font-weight="700">Golden Production Rule:</text>
      <text x="10" y="42" fill="#f8fafc" font-size="10">Never disable Block Public Access</text>
      <text x="10" y="58" fill="#94a3b8" font-size="9">to serve files. Always use</text>
      <text x="10" y="72" fill="#38bdf8" font-size="10">CloudFront OAC or Presigned URLs!</text>
    </g>
  </g>

  <!-- Pillar 2: IAM Least Privilege -->
  <g transform="translate(295, 110)" filter="url(#shadow)">
    <rect width="245" height="370" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
    <rect width="245" height="40" rx="12" fill="#2563eb"/>
    <text x="122" y="25" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">2. IAM Least Privilege</text>

    <g transform="translate(15, 60)">
      <rect width="215" height="85" rx="6" fill="#0f172a" stroke="#3b82f6"/>
      <text x="10" y="22" fill="#38bdf8" font-size="11" font-weight="700">IAM Role (EC2 / ECS / Lambda)</text>
      <text x="10" y="42" fill="#4ade80" font-size="10">&#10004; ALLOW: s3:PutObject</text>
      <text x="10" y="58" fill="#4ade80" font-size="10">&#10004; ALLOW: s3:GetObject</text>
      <text x="10" y="74" fill="#ef4444" font-size="10">&#10006; NO s3:DeleteBucket permission</text>
    </g>

    <g transform="translate(15, 160)">
      <rect width="215" height="100" rx="6" fill="#0f172a" stroke="#334155"/>
      <text x="10" y="22" fill="#fcd34d" font-size="11" font-weight="700">Scoped Resource ARN</text>
      <text x="10" y="42" fill="#94a3b8" font-size="9">Resource: [</text>
      <text x="18" y="58" fill="#f8fafc" font-size="9">"arn:aws:s3:::blackbuck/*"</text>
      <text x="10" y="74" fill="#94a3b8" font-size="9">]</text>
      <text x="10" y="92" fill="#38bdf8" font-size="9">Never grant wildcard ("*") buckets!</text>
    </g>

    <g transform="translate(15, 275)">
      <rect width="215" height="85" rx="6" fill="#064e3b" stroke="#10b981"/>
      <text x="10" y="22" fill="#4ade80" font-size="11" font-weight="700">Zero Hardcoded Keys</text>
      <text x="10" y="42" fill="#e2e8f0" font-size="9">&#8226; Never commit AWS_ACCESS_KEY</text>
      <text x="10" y="58" fill="#e2e8f0" font-size="9">&#8226; AWS SDK auto-fetches IAM</text>
      <text x="10" y="72" fill="#a7f3d0" font-size="9">  Instance Profile tokens!</text>
    </g>
  </g>

  <!-- Pillar 3: Bucket Policies -->
  <g transform="translate(560, 110)" filter="url(#shadow)">
    <rect width="245" height="370" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <rect width="245" height="40" rx="12" fill="#059669"/>
    <text x="122" y="25" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">3. S3 Bucket Policy</text>

    <g transform="translate(15, 60)">
      <rect width="215" height="85" rx="6" fill="#0f172a" stroke="#10b981"/>
      <text x="10" y="22" fill="#4ade80" font-size="11" font-weight="700">Enforce HTTPS (TLS 1.2+)</text>
      <text x="10" y="42" fill="#94a3b8" font-size="9">Effect: "Deny"</text>
      <text x="10" y="56" fill="#94a3b8" font-size="9">Condition: { "Bool": {</text>
      <text x="18" y="70" fill="#f87171" font-size="9">"aws:SecureTransport": "false"</text>
      <text x="10" y="84" fill="#94a3b8" font-size="9">}}</text>
    </g>

    <g transform="translate(15, 160)">
      <rect width="215" height="100" rx="6" fill="#0f172a" stroke="#00f0ff"/>
      <text x="10" y="22" fill="#00f0ff" font-size="11" font-weight="700">CloudFront OAC Isolation</text>
      <text x="10" y="40" fill="#94a3b8" font-size="9">Principal: cloudfront.amazonaws.com</text>
      <text x="10" y="56" fill="#94a3b8" font-size="9">SourceArn: Distribution ARN</text>
      <text x="10" y="74" fill="#a7f3d0" font-size="10">&#10004; Only your verified CDN</text>
      <text x="10" y="88" fill="#a7f3d0" font-size="10">  can read objects!</text>
    </g>

    <g transform="translate(15, 275)">
      <rect width="215" height="85" rx="6" fill="#0f172a" stroke="#334155"/>
      <text x="10" y="22" fill="#fcd34d" font-size="11" font-weight="700">Evaluation Logic:</text>
      <text x="10" y="44" fill="#ef4444" font-size="10" font-weight="700">1. Explicit Deny WINS ALWAYS</text>
      <text x="10" y="60" fill="#4ade80" font-size="10">2. Explicit Allow Required</text>
      <text x="10" y="76" fill="#94a3b8" font-size="9">3. Default is DENY ALL</text>
    </g>
  </g>

  <!-- Pillar 4: Encryption at Rest -->
  <g transform="translate(825, 110)" filter="url(#shadow)">
    <rect width="235" height="370" rx="12" fill="#1e293b" stroke="#ec4899" stroke-width="2"/>
    <rect width="235" height="40" rx="12" fill="#db2777"/>
    <text x="117" y="25" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">4. KMS Encryption</text>

    <g transform="translate(15, 60)">
      <rect width="205" height="85" rx="6" fill="#0f172a" stroke="#ec4899"/>
      <text x="10" y="22" fill="#f472b6" font-size="11" font-weight="700">SSE-S3 (Default)</text>
      <text x="10" y="42" fill="#94a3b8" font-size="10">&#8226; 256-bit AES Encryption</text>
      <text x="10" y="58" fill="#94a3b8" font-size="10">&#8226; AWS manages all keys</text>
      <text x="10" y="74" fill="#4ade80" font-size="10">&#8226; Zero extra cost &amp; zero setup</text>
    </g>

    <g transform="translate(15, 160)">
      <rect width="205" height="100" rx="6" fill="#0f172a" stroke="#f59e0b"/>
      <text x="10" y="22" fill="#fcd34d" font-size="11" font-weight="700">SSE-KMS (Enterprise)</text>
      <text x="10" y="42" fill="#94a3b8" font-size="10">&#8226; Customer Managed Key (CMK)</text>
      <text x="10" y="58" fill="#94a3b8" font-size="10">&#8226; Key rotation every 365 days</text>
      <text x="10" y="74" fill="#4ade80" font-size="10">&#8226; Audit trail in AWS CloudTrail</text>
      <text x="10" y="90" fill="#f8fafc" font-size="9">&#128269; Logs who accessed each key</text>
    </g>

    <g transform="translate(15, 275)">
      <rect width="205" height="85" rx="6" fill="#0f172a" stroke="#334155"/>
      <text x="10" y="22" fill="#38bdf8" font-size="11" font-weight="700">Bucket Default SSE</text>
      <text x="10" y="42" fill="#94a3b8" font-size="9">Every new PutObject is</text>
      <text x="10" y="56" fill="#4ade80" font-size="10" font-weight="600">automatically encrypted</text>
      <text x="10" y="72" fill="#94a3b8" font-size="9">before written to disk!</text>
    </g>
  </g>
</svg>
