<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" width="100%" height="100%" style="background:#0f172a; font-family: 'Inter', -apple-system, sans-serif;">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <text x="550" y="40" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="800">Architectural Comparison: Amazon SQS vs. Apache Kafka</text>
  <text x="550" y="66" text-anchor="middle" fill="#94a3b8" font-size="13">Task Queue vs. Distributed Commit Log &#8226; Destructive Ack vs. Replayable Offsets</text>

  <!-- Left: SQS Task Queue -->
  <g transform="translate(40, 95)" filter="url(#shadow)">
    <rect width="490" height="375" rx="12" fill="#1e293b" stroke="#ff9900" stroke-width="2"/>
    <rect width="490" height="42" rx="12" fill="#d97706"/>
    <text x="245" y="27" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">Amazon SQS: Distributed Task Queue</text>

    <!-- Queue Box -->
    <g transform="translate(20, 60)">
      <rect width="450" height="75" rx="8" fill="#0f172a" stroke="#ff9900" stroke-width="1"/>
      <text x="15" y="22" fill="#ff9900" font-size="12" font-weight="700">Queue Buffer (Transient Storage)</text>
      
      <rect x="15" y="32" width="90" height="30" rx="4" fill="#334155"/>
      <text x="60" y="52" text-anchor="middle" fill="#f8fafc" font-size="10">Msg 1 [Ack&#10004;]</text>

      <rect x="115" y="32" width="90" height="30" rx="4" fill="#d97706"/>
      <text x="160" y="52" text-anchor="middle" fill="#ffffff" font-size="10">Msg 2 [Leased]</text>

      <rect x="215" y="32" width="90" height="30" rx="4" fill="#1e293b" stroke="#475569"/>
      <text x="260" y="52" text-anchor="middle" fill="#94a3b8" font-size="10">Msg 3 [Visible]</text>

      <text x="325" y="52" fill="#ef4444" font-size="10" font-weight="600">&#10006; Deleted upon Ack</text>
    </g>

    <!-- Characteristics -->
    <g transform="translate(20, 150)">
      <rect width="450" height="205" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="15" y="25" fill="#38bdf8" font-size="11" font-weight="700">&#8226; Model:</text>
      <text x="80" y="25" fill="#f8fafc" font-size="11">Competing Consumers (Pull-based polling)</text>

      <text x="15" y="52" fill="#38bdf8" font-size="11" font-weight="700">&#8226; Lifecycle:</text>
      <text x="90" y="52" fill="#f8fafc" font-size="11">Ephemeral. Messages permanently deleted after task</text>

      <text x="15" y="79" fill="#38bdf8" font-size="11" font-weight="700">&#8226; Replay:</text>
      <text x="75" y="79" fill="#ef4444" font-size="11">NO replayability. Once processed &amp; deleted, it is gone</text>

      <text x="15" y="106" fill="#38bdf8" font-size="11" font-weight="700">&#8226; Scaling:</text>
      <text x="80" y="106" fill="#4ade80" font-size="11">Zero server management, auto-scales instantly (AWS fully managed)</text>

      <text x="15" y="133" fill="#38bdf8" font-size="11" font-weight="700">&#8226; Retention:</text>
      <text x="95" y="133" fill="#f8fafc" font-size="11">1 minute up to 14 days (default 4 days)</text>

      <text x="15" y="160" fill="#38bdf8" font-size="11" font-weight="700">&#8226; Ideal For:</text>
      <text x="90" y="160" fill="#fcd34d" font-size="11">Asynchronous discrete background jobs (invoices, emails, webhooks)</text>

      <text x="15" y="187" fill="#38bdf8" font-size="11" font-weight="700">&#8226; Ordering:</text>
      <text x="90" y="187" fill="#f8fafc" font-size="11">Standard = Best-effort | FIFO = Strict per MessageGroupId</text>
    </g>
  </g>

  <!-- Right: Kafka Commit Log -->
  <g transform="translate(570, 95)" filter="url(#shadow)">
    <rect width="490" height="375" rx="12" fill="#1e293b" stroke="#00f0ff" stroke-width="2"/>
    <rect width="490" height="42" rx="12" fill="#0284c7"/>
    <text x="245" y="27" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">Apache Kafka: Distributed Append-Only Commit Log</text>

    <!-- Log Box -->
    <g transform="translate(20, 60)">
      <rect width="450" height="75" rx="8" fill="#0f172a" stroke="#00f0ff" stroke-width="1"/>
      <text x="15" y="22" fill="#38bdf8" font-size="12" font-weight="700">Partition Log (Persistent Event Stream)</text>
      
      <rect x="15" y="32" width="60" height="30" rx="4" fill="#065f46"/>
      <text x="45" y="52" text-anchor="middle" fill="#a7f3d0" font-size="10">Offset 0</text>

      <rect x="80" y="32" width="60" height="30" rx="4" fill="#065f46"/>
      <text x="110" y="52" text-anchor="middle" fill="#a7f3d0" font-size="10">Offset 1</text>

      <rect x="145" y="32" width="60" height="30" rx="4" fill="#0284c7"/>
      <text x="175" y="52" text-anchor="middle" fill="#ffffff" font-size="10">Offset 2</text>

      <rect x="210" y="32" width="60" height="30" rx="4" fill="#334155"/>
      <text x="240" y="52" text-anchor="middle" fill="#94a3b8" font-size="10">Offset 3</text>

      <text x="285" y="52" fill="#4ade80" font-size="10" font-weight="600">&#10004; Events retained on disk!</text>
    </g>

    <!-- Characteristics -->
    <g transform="translate(20, 150)">
      <rect width="450" height="205" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="15" y="25" fill="#38bdf8" font-size="11" font-weight="700">&#8226; Model:</text>
      <text x="80" y="25" fill="#f8fafc" font-size="11">Publish/Subscribe via Consumer Groups with trackable offsets</text>

      <text x="15" y="52" fill="#38bdf8" font-size="11" font-weight="700">&#8226; Lifecycle:</text>
      <text x="90" y="52" fill="#f8fafc" font-size="11">Persistent log. Messages remain on disk after consumption</text>

      <text x="15" y="79" fill="#38bdf8" font-size="11" font-weight="700">&#8226; Replay:</text>
      <text x="75" y="79" fill="#4ade80" font-size="11">FULL REPLAY. Consumers can seek offset to 0 and reprocess past data</text>

      <text x="15" y="106" fill="#38bdf8" font-size="11" font-weight="700">&#8226; Scaling:</text>
      <text x="80" y="106" fill="#fcd34d" font-size="11">Requires cluster planning (Brokers, Partitions, ZooKeeper/KRaft)</text>

      <text x="15" y="133" fill="#38bdf8" font-size="11" font-weight="700">&#8226; Retention:</text>
      <text x="95" y="133" fill="#f8fafc" font-size="11">Configurable (days, months, or infinite historical event log)</text>

      <text x="15" y="160" fill="#38bdf8" font-size="11" font-weight="700">&#8226; Ideal For:</text>
      <text x="90" y="160" fill="#fcd34d" font-size="11">High-volume event streaming, real-time analytics, log pipelines (Clickstream)</text>

      <text x="15" y="187" fill="#38bdf8" font-size="11" font-weight="700">&#8226; Ordering:</text>
      <text x="90" y="187" fill="#f8fafc" font-size="11">Strict order guaranteed per Partition</text>
    </g>
  </g>
</svg>
