<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 480" width="100%" height="100%" style="background:#0f172a; font-family: 'Inter', -apple-system, sans-serif;">
  <text x="550" y="40" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="800">Standard Queue vs. FIFO Queue Architecture</text>
  <text x="550" y="66" text-anchor="middle" fill="#94a3b8" font-size="13">Throughput &#8226; Delivery Guarantees &#8226; Ordering &#8226; Message Groups</text>

  <!-- Left Column: Standard Queue -->
  <g transform="translate(60, 95)">
    <rect width="460" height="345" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
    <rect width="460" height="42" rx="12" fill="#2563eb"/>
    <text x="230" y="27" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">Standard SQS Queue</text>

    <g transform="translate(20, 60)">
      <rect width="420" height="45" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="15" y="22" fill="#38bdf8" font-size="12" font-weight="700">🚀 Unlimited Throughput</text>
      <text x="15" y="38" fill="#94a3b8" font-size="11">Virtually limitless transactions/second. Ideal for high-scale decoupled web tasks.</text>
    </g>

    <g transform="translate(20, 115)">
      <rect width="420" height="45" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="15" y="22" fill="#f59e0b" font-size="12" font-weight="700">⚠️ At-Least-Once Delivery</text>
      <text x="15" y="38" fill="#94a3b8" font-size="11">Message delivered at least once, but duplicate delivery can occasionally occur.</text>
    </g>

    <g transform="translate(20, 170)">
      <rect width="420" height="45" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="15" y="22" fill="#38bdf8" font-size="12" font-weight="700">🔀 Best-Effort Ordering</text>
      <text x="15" y="38" fill="#94a3b8" font-size="11">AWS delivers messages roughly in order, but order is NOT strictly guaranteed.</text>
    </g>

    <!-- Visual queue representation -->
    <g transform="translate(20, 230)">
      <rect width="420" height="90" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1"/>
      <text x="15" y="20" fill="#94a3b8" font-size="11" font-weight="600">Queue Flow (Order can shuffle):</text>
      
      <rect x="20" y="35" width="75" height="35" rx="6" fill="#334155"/>
      <text x="57" y="57" text-anchor="middle" fill="#f8fafc" font-size="11">Msg 3</text>

      <rect x="110" y="35" width="75" height="35" rx="6" fill="#334155"/>
      <text x="147" y="57" text-anchor="middle" fill="#f8fafc" font-size="11">Msg 1</text>

      <rect x="200" y="35" width="75" height="35" rx="6" fill="#334155"/>
      <text x="237" y="57" text-anchor="middle" fill="#f8fafc" font-size="11">Msg 2</text>

      <rect x="290" y="35" width="75" height="35" rx="6" fill="#dc2626"/>
      <text x="327" y="57" text-anchor="middle" fill="#f8fafc" font-size="11">Msg 1 (Dup)</text>
    </g>
  </g>

  <!-- Right Column: FIFO Queue -->
  <g transform="translate(580, 95)">
    <rect width="460" height="345" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <rect width="460" height="42" rx="12" fill="#059669"/>
    <text x="230" y="27" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">FIFO SQS Queue (.fifo)</text>

    <g transform="translate(20, 60)">
      <rect width="420" height="45" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="15" y="22" fill="#4ade80" font-size="12" font-weight="700">🎯 Strict First-In-First-Out Ordering</text>
      <text x="15" y="38" fill="#94a3b8" font-size="11">Exact ingestion order is preserved strictly within each MessageGroupId.</text>
    </g>

    <g transform="translate(20, 115)">
      <rect width="420" height="45" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="15" y="22" fill="#4ade80" font-size="12" font-weight="700">🛡️ Exactly-Once Processing</text>
      <text x="15" y="38" fill="#94a3b8" font-size="11">5-minute deduplication window via MessageDeduplicationId stops duplicates.</text>
    </g>

    <g transform="translate(20, 170)">
      <rect width="420" height="45" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="15" y="22" fill="#f59e0b" font-size="12" font-weight="700">⚡ Throughput Limits (300 to 3,000 msgs/sec)</text>
      <text x="15" y="38" fill="#94a3b8" font-size="11">300 ops/s default. High-throughput mode allows 3,000/s with batching.</text>
    </g>

    <!-- Visual FIFO Queue with Group ID -->
    <g transform="translate(20, 230)">
      <rect width="420" height="90" rx="8" fill="#0f172a" stroke="#059669" stroke-width="1"/>
      <text x="15" y="20" fill="#4ade80" font-size="11" font-weight="600">Ordered by MessageGroupId ("cust_101"):</text>
      
      <rect x="20" y="35" width="85" height="35" rx="6" fill="#065f46"/>
      <text x="62" y="57" text-anchor="middle" fill="#a7f3d0" font-size="11">1. Deposit</text>

      <rect x="120" y="35" width="85" height="35" rx="6" fill="#065f46"/>
      <text x="162" y="57" text-anchor="middle" fill="#a7f3d0" font-size="11">2. Purchase</text>

      <rect x="220" y="35" width="85" height="35" rx="6" fill="#065f46"/>
      <text x="262" y="57" text-anchor="middle" fill="#a7f3d0" font-size="11">3. Withdraw</text>

      <text x="360" y="57" text-anchor="middle" fill="#4ade80" font-size="16">&#10004; Strict</text>
    </g>
  </g>
</svg>
