<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>JavaScript BOM & DOM Example</title>
</head>
<body>
  <h1 id="main-title">BOM & DOM Example</h1>
  <button onclick="showWindowDetails()">Show Window Info</button>
  <button onclick="showDocumentDetails()">Show Document Info</button>
  <button onclick="showNavigatorDetails()">Show Navigator Info</button>
  <button onclick="showLocationDetails()">Show Location Info</button>
  <button onclick="goBack()">Go Back in History</button>
  <button onclick="goForward()">Go Forward in History</button>
  <button onclick="showScreenDetails()">Show Screen Info</button>
  <button onclick="storageExample()">Test localStorage</button>
  <button onclick="showDialogs()">Show Dialogs</button>

 <!-- <script src="windowObject.js"></script> -->
  <script>


    // WINDOW OBJECT METHODS
    function showWindowDetails() {
      console.log("=== WINDOW OBJECT ===");
      console.log("Window inner width:", window.innerWidth);
      console.log("Window inner height:", window.innerHeight);
      console.log("Is this window the top window?", window.top === window);
      window.open("https://www.google.com", "_blank"); // Open new tab
    }

    // DOCUMENT OBJECT METHODS
    function showDocumentDetails() {
      console.log("=== DOCUMENT OBJECT ===");
      console.log("Document title:", document.title);
      console.log("Body element:", document.body);
      console.log("All links:", document.links);
      const title = document.getElementById("main-title");
      title.style.color = "blue";
      title.innerText = "Updated via JS!";
    }

    // NAVIGATOR OBJECT
    function showNavigatorDetails() {
      console.log("=== NAVIGATOR OBJECT ===");
      console.log("User agent:", navigator.userAgent);
      console.log("Platform:", navigator.platform);
      console.log("Language:", navigator.language);
      console.log("Cookies enabled:", navigator.cookieEnabled);
      console.log("Online status:", navigator.onLine ? "Online" : "Offline");
    }

    // LOCATION OBJECT
    function showLocationDetails() {
      console.log("=== LOCATION OBJECT ===");
      console.log("Current URL:", location.href);
      console.log("Protocol:", location.protocol);
      console.log("Host:", location.host);
      console.log("Pathname:", location.pathname);
      console.log("Search params:", location.search);
      // Uncomment below to redirect:
      // location.href = "https://youtube.com";
    }

    // HISTORY OBJECT
    function goBack() {
      history.back(); // Go back to previous page
    }

    function goForward() {
      history.forward(); // Go forward to next page
    }

    // SCREEN OBJECT
    function showScreenDetails() {
      console.log("=== SCREEN OBJECT ===");
      console.log("Full width:", screen.width);
      console.log("Full height:", screen.height);
      console.log("Available width:", screen.availWidth);
      console.log("Color depth:", screen.colorDepth);
      console.log("Orientation:", screen.orientation.type);
    }

    // localStorage / sessionStorage Example
    function storageExample() {
      console.log("=== STORAGE OBJECT ===");
      localStorage.setItem("user", "Vishal");
      const user = localStorage.getItem("user");
      console.log("Stored user:", user);
      localStorage.removeItem("user");
      console.log("Removed user from localStorage.");

      sessionStorage.setItem("sessionId", "abc123");
      console.log("Session ID:", sessionStorage.getItem("sessionId"));
    }

    // Dialog Boxes
    function showDialogs() {
      alert("This is a simple alert box.");
      const confirmResult = confirm("Do you like JavaScript?");
      console.log("Confirm result:", confirmResult);
      const name = prompt("What is your name?");
      console.log("User's name:", name);
    }
  </script>
</body>
</html>
