<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" width="100%" height="100%">
  <defs>
    <linearGradient id="nodeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="expressGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <linearGradient id="kafkaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="workerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
    <filter id="nodeShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="450" rx="16" fill="url(#nodeBg)"/>

  <!-- Title Header -->
  <text x="480" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="bold" fill="#38bdf8" text-anchor="middle">Kafka Integration in Node.js (KafkaJS Architecture)</text>
  <text x="480" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">Decoupled Microservices: Express API Producer ──► Kafka Cluster ──► Worker Consumer</text>

  <!-- 1. Node.js Producer Service -->
  <rect x="40" y="105" width="250" height="260" rx="12" fill="#1e293b" stroke="#22c55e" stroke-width="2" filter="url(#nodeShadow)"/>
  <rect x="55" y="120" width="220" height="36" rx="6" fill="url(#expressGrad)"/>
  <text x="165" y="143" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Order Service (Express.js)</text>

  <rect x="55" y="170" width="220" height="50" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="70" y="190" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#4ade80">HTTP POST /api/orders</text>
  <text x="70" y="208" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8">Receives order from web client</text>

  <rect x="55" y="235" width="220" height="110" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="70" y="255" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#38bdf8">KafkaJS Producer Client</text>
  <text x="70" y="275" font-family="monospace" font-size="10" fill="#cbd5e1">• acks: -1 (all)</text>
  <text x="70" y="295" font-family="monospace" font-size="10" fill="#cbd5e1">• key: order.userId</text>
  <text x="70" y="315" font-family="monospace" font-size="10" fill="#cbd5e1">• value: JSON.stringify(data)</text>
  <text x="70" y="335" font-family="monospace" font-size="10" fill="#f59e0b">• compression: gzip / snappy</text>

  <!-- Arrow: Producer to Kafka -->
  <path d="M 290 235 L 355 235" stroke="#22c55e" stroke-width="3" fill="none"/>
  <polygon points="355,230 365,235 355,240" fill="#22c55e"/>
  <text x="328" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" fill="#4ade80" text-anchor="middle">producer.send()</text>

  <!-- 2. Kafka Cluster -->
  <rect x="365" y="105" width="230" height="260" rx="12" fill="#0f172a" stroke="#0284c7" stroke-width="2" filter="url(#nodeShadow)"/>
  <rect x="380" y="120" width="200" height="36" rx="6" fill="url(#kafkaGrad)"/>
  <text x="480" y="143" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Kafka Broker Cluster</text>

  <!-- Partition Logs -->
  <rect x="380" y="170" width="200" height="50" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
  <text x="480" y="190" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#bae6fd" text-anchor="middle">Topic: "order-events"</text>
  <text x="480" y="208" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Partition 0 | Partition 1 | Partition 2</text>

  <rect x="380" y="235" width="200" height="45" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
  <text x="480" y="255" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#fde68a" text-anchor="middle">Retry Topic: "order-retry"</text>
  <text x="480" y="270" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Transient network retries (backoff)</text>

  <rect x="380" y="295" width="200" height="50" rx="6" fill="#1e293b" stroke="#ef4444" stroke-width="1"/>
  <text x="480" y="315" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#fca5a5" text-anchor="middle">DLQ: "order-dead-letter"</text>
  <text x="480" y="333" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Poison pills &amp; permanent failures</text>

  <!-- Arrow: Kafka to Consumer -->
  <path d="M 595 235 L 660 235" stroke="#a855f7" stroke-width="3" fill="none"/>
  <polygon points="660,230 670,235 660,240" fill="#a855f7"/>
  <text x="632" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" fill="#c084fc" text-anchor="middle">consumer.run()</text>

  <!-- 3. Node.js Consumer Worker -->
  <rect x="670" y="105" width="250" height="260" rx="12" fill="#1e293b" stroke="#a855f7" stroke-width="2" filter="url(#nodeShadow)"/>
  <rect x="685" y="120" width="220" height="36" rx="6" fill="url(#workerGrad)"/>
  <text x="795" y="143" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Worker Service (Node.js)</text>

  <rect x="685" y="170" width="220" height="50" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="700" y="190" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#d8b4fe">Consumer Group</text>
  <text x="700" y="208" font-family="monospace" font-size="10" fill="#94a3b8">groupId: 'order-worker-group'</text>

  <rect x="685" y="235" width="220" height="110" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="700" y="255" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#38bdf8">Processing Loop</text>
  <text x="700" y="275" font-family="monospace" font-size="10" fill="#cbd5e1">• eachMessage: parse &amp; save</text>
  <text x="700" y="295" font-family="monospace" font-size="10" fill="#cbd5e1">• eachBatch: high throughput</text>
  <text x="700" y="315" font-family="monospace" font-size="10" fill="#cbd5e1">• autoCommit: true / manual</text>
  <text x="700" y="335" font-family="monospace" font-size="10" fill="#4ade80">• Graceful SIGTERM shutdown</text>

  <!-- Bottom Tip -->
  <rect x="40" y="385" width="880" height="42" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="480" y="411" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#cbd5e1" text-anchor="middle">
    <tspan fill="#38bdf8" font-weight="bold">Best Practice in Node.js:</tspan> Always use a shared singleton <tspan fill="#4ade80">Kafka instance</tspan>, reuse producer connections across HTTP requests, and handle <tspan fill="#f59e0b">SIGINT/SIGTERM</tspan> signals to gracefully disconnect!
  </text>
</svg>
