<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 440" width="100%" height="100%">
  <defs>
    <linearGradient id="compBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#1e2235"/>
    </linearGradient>
    <linearGradient id="k1Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="k2Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="k3Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="tombGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <filter id="compShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="950" height="440" rx="16" fill="url(#compBg)"/>

  <!-- Title -->
  <text x="475" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="bold" fill="#38bdf8" text-anchor="middle">Kafka Log Compaction Internals (cleanup.policy=compact)</text>
  <text x="475" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">Retains the latest value per key; purges obsolete historical updates</text>

  <!-- BEFORE COMPACTION SECTION -->
  <rect x="50" y="95" width="850" height="125" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.5" filter="url(#compShadow)"/>
  <text x="70" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#f8fafc">1. Before Log Compaction (Chronological Append Log)</text>

  <g transform="translate(70, 135)">
    <!-- 0: K1=v1 -->
    <rect x="0" y="0" width="100" height="65" rx="6" fill="#334155" stroke="#64748b" stroke-width="1.5"/>
    <text x="50" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Offset 0</text>
    <text x="50" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#60a5fa" text-anchor="middle">K1 : "Pune"</text>
    <text x="50" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#ef4444" text-anchor="middle">(Old - deleted)</text>

    <!-- 1: K2=v1 -->
    <rect x="115" y="0" width="100" height="65" rx="6" fill="#334155" stroke="#64748b" stroke-width="1.5"/>
    <text x="165" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Offset 1</text>
    <text x="165" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#34d399" text-anchor="middle">K2 : "Active"</text>
    <text x="165" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#ef4444" text-anchor="middle">(Old - deleted)</text>

    <!-- 2: K3=v1 -->
    <rect x="230" y="0" width="100" height="65" rx="6" fill="url(#k3Grad)" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="280" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#fef3c7" text-anchor="middle">Offset 2</text>
    <text x="280" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">K3 : "₹500"</text>
    <text x="280" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#fde68a" text-anchor="middle">Latest for K3</text>

    <!-- 3: K1=v2 (Update) -->
    <rect x="345" y="0" width="100" height="65" rx="6" fill="url(#k1Grad)" stroke="#60a5fa" stroke-width="2"/>
    <text x="395" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#dbeafe" text-anchor="middle">Offset 3</text>
    <text x="395" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">K1 : "Mumbai"</text>
    <text x="395" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#bfdbfe" text-anchor="middle">Latest for K1</text>

    <!-- 4: K2=null (Tombstone) -->
    <rect x="460" y="0" width="125" height="65" rx="6" fill="url(#tombGrad)" stroke="#f87171" stroke-width="2"/>
    <text x="522" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#fee2e2" text-anchor="middle">Offset 4</text>
    <text x="522" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">K2 : NULL (Tomb)</text>
    <text x="522" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#fecaca" text-anchor="middle">Deletes Key K2</text>
  </g>

  <!-- Downward Transition Indicator -->
  <path d="M 475 225 L 475 255" stroke="#38bdf8" stroke-width="3" stroke-dasharray="4,4"/>
  <text x="475" y="250" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#38bdf8" text-anchor="middle" font-weight="bold">Kafka Log Cleaner Thread Compaction</text>

  <!-- AFTER COMPACTION SECTION -->
  <rect x="50" y="265" width="850" height="115" rx="10" fill="#0f172a" stroke="#22c55e" stroke-width="2" filter="url(#compShadow)"/>
  <text x="70" y="292" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#4ade80">2. After Log Compaction (Compact Tail - Zero Space Waste)</text>

  <g transform="translate(70, 305)">
    <!-- Retained Offset 2: K3="₹500" -->
    <rect x="0" y="0" width="120" height="55" rx="6" fill="url(#k3Grad)" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="60" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#fef3c7" text-anchor="middle">Offset 2</text>
    <text x="60" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">K3 : "₹500"</text>

    <!-- Retained Offset 3: K1="Mumbai" -->
    <rect x="140" y="0" width="120" height="55" rx="6" fill="url(#k1Grad)" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="200" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#dbeafe" text-anchor="middle">Offset 3</text>
    <text x="200" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">K1 : "Mumbai"</text>

    <!-- Explanation Box for Tombstone -->
    <rect x="300" y="5" width="510" height="45" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="320" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#cbd5e1">
      <tspan fill="#f87171" font-weight="bold">Notice:</tspan> Offsets 0 and 1 are deleted permanently. Offset numbers remain unchanged!
    </text>
    <text x="320" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#cbd5e1">
      <tspan fill="#f87171" font-weight="bold">Tombstone (K2=null):</tspan> Purged after <tspan fill="#38bdf8">delete.retention.ms</tspan> expires, completely erasing K2.
    </text>
  </g>

  <!-- Footer Tip -->
  <text x="475" y="415" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">
    💡 <tspan fill="#f8fafc" font-weight="bold">Best For:</tspan> Change Data Capture (Debezium), User profile state, Product inventory snapshots, and KTable state stores.
  </text>
</svg>
